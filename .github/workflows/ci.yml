name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab-maintenance:
    name: Apply lab formatting
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'chatgpt/consensus-performance-lab'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/consensus-performance-lab

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply benchmark fix and gofmt
        run: |
          python scripts/fix_performance_lab.py
          gofmt -w internal/api/performance_lab_test.go

      - name: Verify focused lab
        run: |
          go test ./internal/api -run '^TestLab' -count=1 -timeout=90s
          go test ./internal/api -run '^$' -bench '^BenchmarkLabConsensusFinality7Validators$' -benchtime=3x -count=1 -timeout=120s

      - name: Commit verified lab update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/api/performance_lab_test.go
          git commit -m "stabilize sustained consensus benchmark"
          git push origin HEAD:chatgpt/consensus-performance-lab

  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting of changed Go files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$base" HEAD -- '*.go')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Go files to format-check."
            exit 0
          fi

          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            echo "The following changed Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  consensus-lab:
    name: Consensus & performance lab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Multi-validator conformance gate
        run: go test ./internal/api -run '^TestLab' -count=1 -timeout=90s

      - name: Seven-validator finalized-throughput sample
        run: go test ./internal/api -run '^$' -bench '^BenchmarkLabConsensusFinality7Validators$' -benchtime=3x -count=1 -timeout=120s

      - name: P-256 verification baseline
        run: go test ./internal/api -run '^$' -bench '^BenchmarkLabP256TransactionVerification$' -benchtime=1s -count=1

  wallet:
    name: Wallet build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wallet
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/wallet/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production and build dependencies
        run: npm audit --audit-level=high

      - name: Type-check and build
        run: npm run build