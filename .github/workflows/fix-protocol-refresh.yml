name: Protocol wallet refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  wallet:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/protocol-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Integrate wallet protocol
        run: python scripts/protocol_wallet_refresh.py
      - name: Verify wallet
        working-directory: apps/wallet
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Commit verified wallet integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/wallet
          if git diff --cached --quiet; then
            echo "No wallet integration changes to commit."
            exit 0
          fi
          git commit -m "bind wallet signatures to node chain identity"
          git push origin HEAD:chatgpt/protocol-hardening
