name: Ledger persistence refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/hardening-foundation

      - name: Patch store persistence boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('internal/ledger/store.go')
          source = path.read_text()
          replacements = {
              'os.MkdirAll(dataDir, 0o755)': 'os.MkdirAll(dataDir, 0o700)',
              'return os.WriteFile(s.statePath, raw, 0o644)': 'return writeFileAtomic(s.statePath, raw, 0o600)',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
          gofmt -w internal/ledger/store.go internal/ledger/atomic_file.go internal/ledger/atomic_file_test.go

      - name: Verify ledger package
        run: go test ./internal/ledger

      - name: Commit persistence hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/ledger/store.go internal/ledger/atomic_file.go internal/ledger/atomic_file_test.go
          if git diff --cached --quiet; then
            echo "No persistence changes to commit."
            exit 0
          fi
          git commit -m "make ledger state persistence atomic"
          git push origin HEAD:chatgpt/hardening-foundation
