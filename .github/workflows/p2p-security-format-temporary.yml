name: Temporary P2P Security gofmt

on:
  push:
    branches:
      - security-v2-provider-identity-admission

permissions:
  contents: write

concurrency:
  group: temporary-p2p-security-format
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'the-code-learner/Zephyr-Chain' && github.ref == 'refs/heads/security-v2-provider-identity-admission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security-v2-provider-identity-admission
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt and commit only exact security tranche files
        run: |
          gofmt -w cmd/zephyr-genesis-audit/main.go cmd/zephyr-genesis-audit/main_test.go cmd/compute-provider/main.go cmd/compute-provider/admission.go cmd/compute-provider/admission_test.go internal/v2/genesis/genesis.go internal/v2/genesis/supply_overflow_test.go internal/v2/network/p2p/identity.go internal/v2/network/p2p/identity_test.go
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd/zephyr-genesis-audit cmd/compute-provider internal/v2/genesis/genesis.go internal/v2/genesis/supply_overflow_test.go internal/v2/network/p2p/identity.go internal/v2/network/p2p/identity_test.go
          git commit -m 'gofmt exact mainnet-security foundation files'
          git push origin HEAD:security-v2-provider-identity-admission
