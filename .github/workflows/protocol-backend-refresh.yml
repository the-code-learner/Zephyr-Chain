name: Protocol backend refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protocol branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/protocol-hardening
          fetch-depth: 0
      - name: Integrate protocol backend
        run: |
          python scripts/protocol_backend_refresh.py
          python scripts/protocol_backend_testfix.py
          gofmt -w internal/protocol internal/tx internal/consensus internal/ledger internal/api cmd/node
      - name: Verify backend
        run: |
          go vet ./...
          go test ./...
      - name: Commit verified backend integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal cmd
          if git diff --cached --quiet; then
            echo "No backend integration changes to commit."
            exit 0
          fi
          git commit -m "integrate chain-bound protocol and snapshot quorum"
          git push origin HEAD:chatgpt/protocol-hardening
