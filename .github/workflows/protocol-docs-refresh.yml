name: Protocol docs refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/protocol-hardening
      - name: Update devnet security guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/usage.md')
          source = path.read_text()
          replacement = r'''## Run A Two-Node Devnet

Use separate terminals, separate data directories, and one stable chain ID for every node that belongs to the same network. Internal peer replication now requires each node to possess a validator P-256 private key; a node name or unsigned peer request is not sufficient authentication.

The examples below use placeholders for validator keys and their derived Zephyr addresses. Replace them with real values before starting the nodes.

Node A:

```powershell
$env:ZEPHYR_CHAIN_ID="zephyr-devnet-1"
$env:ZEPHYR_NODE_ID="node-a"
$env:ZEPHYR_HTTP_ADDR=":8080"
$env:ZEPHYR_DATA_DIR="var/devnet-a"
$env:ZEPHYR_VALIDATOR_PRIVATE_KEY="<validator-a-base64-pkcs8-p256-private-key>"
$env:ZEPHYR_PEERS="http://localhost:8081"
$env:ZEPHYR_PEER_VALIDATORS="http://localhost:8081=zph_<validator-b-address>"
$env:ZEPHYR_ENABLE_BLOCK_PRODUCTION="true"
$env:ZEPHYR_ENABLE_PEER_SYNC="true"
go run ./cmd/node
```

Node B:

```powershell
$env:ZEPHYR_CHAIN_ID="zephyr-devnet-1"
$env:ZEPHYR_NODE_ID="node-b"
$env:ZEPHYR_HTTP_ADDR=":8081"
$env:ZEPHYR_DATA_DIR="var/devnet-b"
$env:ZEPHYR_VALIDATOR_PRIVATE_KEY="<validator-b-base64-pkcs8-p256-private-key>"
$env:ZEPHYR_PEERS="http://localhost:8080"
$env:ZEPHYR_PEER_VALIDATORS="http://localhost:8080=zph_<validator-a-address>"
$env:ZEPHYR_ENABLE_BLOCK_PRODUCTION="false"
$env:ZEPHYR_ENABLE_PEER_SYNC="true"
go run ./cmd/node
```

What to expect:

- every signed transaction, proposal, vote, block, peer request, and snapshot is bound to `ZEPHYR_CHAIN_ID`; nodes on a different chain ID reject one another's security-critical messages
- `GET /v1/status` exposes the node chain ID and, when a validator key is configured, a chain-bound signed discovery identity
- internal replication uses a separate request proof bound to HTTP method, path, body hash, nonce, timestamp, chain ID, node ID, and validator address; captured proofs cannot be reused for another request
- `ZEPHYR_PEER_VALIDATORS` can pin each configured peer URL to the validator address expected at that endpoint
- initial synchronization can still validate public block history one block at a time; snapshot replacement is not a single-peer bootstrap mechanism
- snapshot recovery requires a locally trusted validator set plus matching snapshot proofs reaching the normal 2/3+ voting-power quorum. A single peer, even when correctly authenticated, cannot replace local ledger state
- for a brand-new network, establish validator/genesis or checkpoint trust before relying on quorum snapshot recovery

See [docs/protocol-security.md](./protocol-security.md) for the signing domains, replay protection, state-root commitment, and snapshot trust model.

'''
          pattern = r'## Run A Two-Node Devnet\n.*?(?=## Inspect Validator Scheduling\n)'
          updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('two-node devnet section not found')
          path.write_text(updated)
          PY
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/usage.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "document authenticated clean-break devnet protocol"
          git push origin HEAD:chatgpt/protocol-hardening
