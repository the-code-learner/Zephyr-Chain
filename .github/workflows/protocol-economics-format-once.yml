name: Protocol Economics Format Once

on:
  push:
    branches:
      - protocol-economics-p1
    paths:
      - internal/v2/economics/zcu_reference.go
      - internal/v2/economics/zcu_reference_test.go
      - internal/v2/economics/zppi.go
      - internal/v2/economics/zppi_test.go
      - .github/workflows/protocol-economics-format-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'the-code-learner/Zephyr-Chain' && github.ref == 'refs/heads/protocol-economics-p1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout economics branch
        uses: actions/checkout@v6
        with:
          ref: protocol-economics-p1
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format economics tranche
        run: |
          gofmt -w \
            internal/v2/economics/zcu_reference.go \
            internal/v2/economics/zcu_reference_test.go \
            internal/v2/economics/zppi.go \
            internal/v2/economics/zppi_test.go
          git rm .github/workflows/protocol-economics-format-once.yml
      - name: Commit exact formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'gofmt protocol economics P1 tranche'
          git push origin HEAD:protocol-economics-p1
