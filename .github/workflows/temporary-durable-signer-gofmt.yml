name: Temporary Durable Signer gofmt

on:
  push:
    branches:
      - security-v2-durable-consensus-signing-guard

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'the-code-learner/Zephyr-Chain' && github.ref == 'refs/heads/security-v2-durable-consensus-signing-guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security-v2-durable-consensus-signing-guard
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format signer security changes
        run: |
          gofmt -w internal/v2/consensus/signing_guard.go internal/v2/consensus/signing_guard_unix.go internal/v2/consensus/signing_guard_unsupported.go internal/v2/consensus/signing_guard_test.go internal/v2/node/service.go internal/v2/node/protected_signing_test.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/v2/consensus/signing_guard.go internal/v2/consensus/signing_guard_unix.go internal/v2/consensus/signing_guard_unsupported.go internal/v2/consensus/signing_guard_test.go internal/v2/node/service.go internal/v2/node/protected_signing_test.go
          git commit -m 'gofmt durable consensus signing protection'
          git push origin HEAD:security-v2-durable-consensus-signing-guard
