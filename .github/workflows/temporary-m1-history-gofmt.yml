name: Temporary M1 Finality History gofmt

on:
  push:
    branches:
      - m1-certified-multiheight-history

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'the-code-learner/Zephyr-Chain' && github.ref == 'refs/heads/m1-certified-multiheight-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: m1-certified-multiheight-history
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format exact M1 history files
        run: |
          gofmt -w internal/v2/node/certified_history.go internal/v2/node/certified_history_unix.go internal/v2/node/certified_history_unsupported.go internal/v2/node/certified_history_test.go internal/v2/node/runtime.go internal/v2/bootstrap/observer.go internal/v2/bootstrap/observer_test.go cmd/v2-observer/main.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/v2/node/certified_history.go internal/v2/node/certified_history_unix.go internal/v2/node/certified_history_unsupported.go internal/v2/node/certified_history_test.go internal/v2/node/runtime.go internal/v2/bootstrap/observer.go internal/v2/bootstrap/observer_test.go cmd/v2-observer/main.go
          git commit -m 'gofmt certified multiheight finality history'
          git push origin HEAD:m1-certified-multiheight-history
