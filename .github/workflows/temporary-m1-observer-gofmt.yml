name: Temporary M1 Observer gofmt

on:
  push:
    branches:
      - m1-v2-pinned-observer-bootstrap

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'the-code-learner/Zephyr-Chain' && github.ref == 'refs/heads/m1-v2-pinned-observer-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: m1-v2-pinned-observer-bootstrap
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format exact observer bootstrap files
        run: |
          gofmt -w internal/v2/bootstrap/observer.go internal/v2/bootstrap/observer_test.go cmd/v2-observer/main.go cmd/v2-observer/main_test.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/v2/bootstrap/observer.go internal/v2/bootstrap/observer_test.go cmd/v2-observer/main.go cmd/v2-observer/main_test.go
          git commit -m 'gofmt pinned v2 observer startup and tests'
          git push origin HEAD:m1-v2-pinned-observer-bootstrap
