name: Temporary M1 Consensus Peer Snapshot gofmt

on:
  push:
    branches:
      - m1-consensus-rebroadcast-clean-shutdown

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'the-code-learner/Zephyr-Chain' && github.ref == 'refs/heads/m1-consensus-rebroadcast-clean-shutdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: m1-consensus-rebroadcast-clean-shutdown
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply exact Go formatting
        run: |
          gofmt -w internal/api/server.go internal/api/server_test.go internal/api/peer_admission.go internal/api/peer_sync.go internal/api/certified_block_recovery.go internal/api/peer_urls_test.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/api/server.go internal/api/server_test.go internal/api/peer_admission.go internal/api/peer_sync.go internal/api/certified_block_recovery.go internal/api/peer_urls_test.go
          git commit -m 'gofmt concurrent consensus peer snapshot and cleanup regressions'
          git push origin HEAD:m1-consensus-rebroadcast-clean-shutdown
