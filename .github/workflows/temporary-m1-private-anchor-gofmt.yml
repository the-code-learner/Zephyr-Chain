name: Temporary M1 Private Anchor Test gofmt

on:
  push:
    branches:
      - m1-external-monotonic-finality-anchor

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'the-code-learner/Zephyr-Chain' && github.ref == 'refs/heads/m1-external-monotonic-finality-anchor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: m1-external-monotonic-finality-anchor
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format private external anchor regressions
        run: |
          gofmt -w internal/v2/node/finality_anchor_store_test.go internal/v2/bootstrap/observer_test.go cmd/v2-observer/main_test.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/v2/node/finality_anchor_store_test.go internal/v2/bootstrap/observer_test.go cmd/v2-observer/main_test.go
          git commit -m 'gofmt explicitly private external anchor test fixtures'
          git push origin HEAD:m1-external-monotonic-finality-anchor
