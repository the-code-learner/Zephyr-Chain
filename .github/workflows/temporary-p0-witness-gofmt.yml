name: Temporary P0 Witness Checkpoint gofmt

on:
  push:
    branches:
      - p0-quorum-witness-checkpoints

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'the-code-learner/Zephyr-Chain' && github.ref == 'refs/heads/p0-quorum-witness-checkpoints'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p0-quorum-witness-checkpoints
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply repository Go formatter to witness and replay paths
        run: |
          gofmt -w internal/v2/node/witness_checkpoint.go internal/v2/node/witness_checkpoint_test.go internal/v2/node/certified_history.go internal/v2/bootstrap/observer.go cmd/v2-observer/main.go cmd/v2-observer/main_test.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/v2/node/witness_checkpoint.go internal/v2/node/witness_checkpoint_test.go internal/v2/node/certified_history.go internal/v2/bootstrap/observer.go cmd/v2-observer/main.go cmd/v2-observer/main_test.go
          git commit -m 'gofmt threshold witness checkpoint verification and signed observer CLI'
          git push origin HEAD:p0-quorum-witness-checkpoints
