name: V2 Devnet Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      validators:
        description: Number of Protocol v2 validator nodes for the transaction/finality scenario.
        required: true
        default: "20"

permissions:
  contents: read

concurrency:
  group: v2-devnet-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devnet:
    name: Protocol v2 ephemeral devnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZEPHYR_DEVNET_VALIDATORS: ${{ github.event_name == 'workflow_dispatch' && inputs.validators || '7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run transaction, voting, finality and quorum-fault devnet
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/v2/node \
            -run '^TestProtocolV2Devnet' \
            -count=1 \
            -v 2>&1 | tee v2-devnet-gate.log

      - name: Upload devnet log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-devnet-gate-${{ github.sha }}
          path: v2-devnet-gate.log
          if-no-files-found: warn
          retention-days: 14
