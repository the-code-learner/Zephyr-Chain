name: V2 Devnet Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      validators:
        description: Number of Protocol v2 validator nodes for the large transaction/finality smoke.
        required: true
        default: "20"

permissions:
  contents: read

concurrency:
  group: v2-devnet-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devnet:
    name: Protocol v2 ephemeral devnet
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run transaction, voting, finality and quorum-fault devnet
        shell: bash
        run: |
          set -o pipefail
          ZEPHYR_DEVNET_VALIDATORS=7 go test ./internal/v2/node \
            -run '^TestProtocolV2Devnet' \
            -count=1 \
            -v 2>&1 | tee v2-devnet-gate.log

      - name: Run large validator-set transaction and finality smoke
        shell: bash
        env:
          ZEPHYR_DEVNET_SCALE_VALIDATORS: ${{ inputs.validators || '20' }}
        run: |
          set -o pipefail
          ZEPHYR_DEVNET_VALIDATORS="$ZEPHYR_DEVNET_SCALE_VALIDATORS" go test ./internal/v2/node \
            -run '^TestProtocolV2DevnetTransactionVotingAndFinality$' \
            -count=1 \
            -v 2>&1 | tee v2-devnet-scale.log

      - name: Upload devnet logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-devnet-gate-${{ github.sha }}
          path: |
            v2-devnet-gate.log
            v2-devnet-scale.log
          if-no-files-found: warn
          retention-days: 14

  required-status:
    name: V2 Devnet Gate
    needs:
      - devnet
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require devnet job
        env:
          DEVNET_RESULT: ${{ needs.devnet.result }}
        run: test "$DEVNET_RESULT" = "success"
