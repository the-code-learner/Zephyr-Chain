name: V2 Four-Process Signed QC Lab

on:
  pull_request:
    paths:
      - '.github/workflows/v2-four-process-qc.yml'
      - 'cmd/v2-lab-validator/**'
      - 'cmd/v2-lab-fixture/**'
      - 'cmd/v2-lab-qc-verify/**'
      - 'scripts/v2-lab-qc-smoke.py'
      - 'internal/v2/node/**'
      - 'internal/v2/consensus/**'
      - 'internal/v2/bootstrap/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-four-process-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-qc:
    name: Four real QUIC validator processes finalize one signed QC
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build isolated V2 lab binary, fixture and independent QC verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/v2-lab-validator" ./cmd/v2-lab-validator
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/v2-lab-fixture" ./cmd/v2-lab-fixture
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/v2-lab-qc-verify" ./cmd/v2-lab-qc-verify
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "cpu_count=$(nproc)"
            echo "go_version=$(go version)"
            echo "topology=FOUR-V2-OS-processes-on-ONE-GitHub-host"
            echo "scope=authenticated-QUIC-and-signed-QC-no-independent-operator-or-multi-host"
            sha256sum "$RUNNER_TEMP/v2-lab-validator" "$RUNNER_TEMP/v2-lab-fixture" "$RUNNER_TEMP/v2-lab-qc-verify"
          } > evidence/environment.txt

      - name: Finalize one empty lab block across real signed QUIC processes
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PRIVATE_ROOT"' EXIT
          chmod 700 "$PRIVATE_ROOT"
          "$RUNNER_TEMP/v2-lab-fixture" -acknowledge-lab-only -dir "$PRIVATE_ROOT/lab" -validators 4 > "$PRIVATE_ROOT/manifest.json"
          python3 scripts/v2-lab-qc-smoke.py \
            --binary "$RUNNER_TEMP/v2-lab-validator" \
            --manifest "$PRIVATE_ROOT/manifest.json" \
            --evidence evidence
          "$RUNNER_TEMP/v2-lab-qc-verify" \
            -genesis "$(jq -r '.genesisFile' "$PRIVATE_ROOT/manifest.json")" \
            -snapshot evidence/v2-finalized-snapshot.json \
            -network-id "$(jq -r '.networkId' "$PRIVATE_ROOT/manifest.json")" \
            -validator-root "$(jq -r '.validatorRoot' "$PRIVATE_ROOT/manifest.json")" \
            -header-hash "$(jq -r '.headerHash' evidence/v2-four-process-qc-summary.json)" \
            2>&1 | tee evidence/independent-qc-verification.txt
          echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/environment.txt

      - name: Upload signed QC and nonsecret diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-four-process-signed-qc-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
