name: V2 4-7 Process Signed QC Lab

on:
  pull_request:
    paths:
      - '.github/workflows/v2-four-process-qc.yml'
      - 'cmd/v2-lab-validator/**'
      - 'cmd/v2-observer/**'
      - 'cmd/v2-lab-fixture/**'
      - 'cmd/v2-lab-qc-verify/**'
      - 'scripts/v2-lab-qc-smoke.py'
      - 'scripts/v2-observer-recovery-smoke.py'
      - 'internal/v2/node/**'
      - 'internal/v2/consensus/**'
      - 'internal/v2/bootstrap/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-four-process-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-qc:
    name: Signed QC (${{ matrix.validators }} V2 processes)
    strategy:
      fail-fast: false
      matrix:
        validators: [4, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build isolated V2 lab binary, fixture and independent QC verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/v2-lab-validator" ./cmd/v2-lab-validator
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/v2-lab-fixture" ./cmd/v2-lab-fixture
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/v2-observer" ./cmd/v2-observer
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/v2-lab-qc-verify" ./cmd/v2-lab-qc-verify
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "cpu_count=$(nproc)"
            echo "go_version=$(go version)"
            echo "topology=${{ matrix.validators }}-V2-OS-processes-on-ONE-GitHub-host"
            echo "scope=authenticated-QUIC-and-signed-QC-no-independent-operator-or-multi-host"
            sha256sum "$RUNNER_TEMP/v2-lab-validator" "$RUNNER_TEMP/v2-lab-fixture" "$RUNNER_TEMP/v2-lab-qc-verify" "$RUNNER_TEMP/v2-observer"
          } > evidence/environment.txt

      - name: Finalize two consecutive empty lab blocks across real signed QUIC processes
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PRIVATE_ROOT"' EXIT
          chmod 700 "$PRIVATE_ROOT"
          "$RUNNER_TEMP/v2-lab-fixture" -acknowledge-lab-only -dir "$PRIVATE_ROOT/lab" -validators ${{ matrix.validators }} > "$PRIVATE_ROOT/manifest.json"
          python3 scripts/v2-lab-qc-smoke.py \
            --binary "$RUNNER_TEMP/v2-lab-validator" \
            --observer-binary "$RUNNER_TEMP/v2-observer" \
            --manifest "$PRIVATE_ROOT/manifest.json" \
            --evidence evidence
          "$RUNNER_TEMP/v2-lab-qc-verify" \
            -genesis "$(jq -r '.genesisFile' "$PRIVATE_ROOT/manifest.json")" \
            -snapshot evidence/v2-height-1-snapshot.json \
            -expected-height 1 \
            -network-id "$(jq -r '.networkId' "$PRIVATE_ROOT/manifest.json")" \
            -validator-root "$(jq -r '.validatorRoot' "$PRIVATE_ROOT/manifest.json")" \
            -header-hash "$(jq -r '.heightOneHeaderHash' evidence/v2-four-process-qc-summary.json)" \
            2>&1 | tee evidence/independent-qc-height-one.txt
          "$RUNNER_TEMP/v2-lab-qc-verify" \
            -genesis "$(jq -r '.genesisFile' "$PRIVATE_ROOT/manifest.json")" \
            -snapshot evidence/v2-finalized-snapshot.json \
            -expected-height 2 \
            -network-id "$(jq -r '.networkId' "$PRIVATE_ROOT/manifest.json")" \
            -validator-root "$(jq -r '.validatorRoot' "$PRIVATE_ROOT/manifest.json")" \
            -header-hash "$(jq -r '.headerHash' evidence/v2-four-process-qc-summary.json)" \
            2>&1 | tee evidence/independent-qc-verification.txt
          # Corrupt one signature, preserving parseable base64 encoding.
          python3 - <<'PY'
          import json
          with open("evidence/v2-finalized-snapshot.json") as stream:
              snapshot = json.load(stream)
          votes = snapshot["Certificate"]["Votes"]
          assert votes and isinstance(votes[0]["Signature"], str)
          signature = votes[0]["Signature"]
          assert len(signature) > 0
          votes[0]["Signature"] = ("A" if signature[0] != "A" else "B") + signature[1:]
          with open("evidence/v2-tampered-snapshot.json", "w") as stream:
              json.dump(snapshot, stream)
          PY
          if "$RUNNER_TEMP/v2-lab-qc-verify" \
            -genesis "$(jq -r '.genesisFile' "$PRIVATE_ROOT/manifest.json")" \
            -snapshot evidence/v2-tampered-snapshot.json \
            -expected-height 2 \
            -network-id "$(jq -r '.networkId' "$PRIVATE_ROOT/manifest.json")" \
            -validator-root "$(jq -r '.validatorRoot' "$PRIVATE_ROOT/manifest.json")" \
            -header-hash "$(jq -r '.headerHash' evidence/v2-four-process-qc-summary.json)" \
            > evidence/tampered-proof-check.txt 2>&1; then
            echo "ERROR: mutated QC signature was accepted"
            exit 1
          fi
          echo "PASS: mutated signed certificate correctly rejected" | tee -a evidence/tampered-proof-check.txt
          # Keep valid signatures but remove enough votes to lose >2/3.
          V2_VALIDATORS="${{ matrix.validators }}" python3 - <<'PY'
          import json
          import os
          with open("evidence/v2-finalized-snapshot.json") as stream:
              snapshot = json.load(stream)
          validators = int(os.environ["V2_VALIDATORS"])
          quorum = (2 * validators) // 3 + 1
          votes = snapshot["Certificate"]["Votes"]
          assert len(votes) >= quorum
          snapshot["Certificate"]["Votes"] = votes[:quorum - 1]
          with open("evidence/v2-underquorum-snapshot.json", "w") as stream:
              json.dump(snapshot, stream, sort_keys=True)
          PY
          if "$RUNNER_TEMP/v2-lab-qc-verify" \
            -genesis "$(jq -r '.genesisFile' "$PRIVATE_ROOT/manifest.json")" \
            -snapshot evidence/v2-underquorum-snapshot.json \
            -expected-height 2 \
            -network-id "$(jq -r '.networkId' "$PRIVATE_ROOT/manifest.json")" \
            -validator-root "$(jq -r '.validatorRoot' "$PRIVATE_ROOT/manifest.json")" \
            -header-hash "$(jq -r '.headerHash' evidence/v2-four-process-qc-summary.json)" \
            > evidence/underquorum-proof-check.txt 2>&1; then
            echo "ERROR: insufficient signed QC power was accepted"
            exit 1
          fi
          echo "PASS: independently rejected valid signatures with insufficient QC quorum" | tee -a evidence/underquorum-proof-check.txt
          python3 scripts/v2-observer-recovery-smoke.py \
            --observer-binary "$RUNNER_TEMP/v2-observer" \
            --manifest "$PRIVATE_ROOT/manifest.json" \
            --summary evidence/v2-four-process-qc-summary.json \
            --evidence evidence
          echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/environment.txt

      - name: Upload signed QC and nonsecret diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-signed-qc-observer-${{ matrix.validators }}-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
