name: V2 Security Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v2-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    name: Security-sensitive Go race checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Race-check genesis, transport, provider, committee and state
        run: |
          go test -race \
            ./internal/v2/genesis \
            ./internal/v2/network/p2p \
            ./internal/v2/provider \
            ./internal/v2/committee \
            ./internal/v2/worldstate \
            ./internal/v2/consensus \
            ./internal/v2/bootstrap \
            ./cmd/compute-provider \
            ./cmd/zephyr-genesis-audit \
            ./cmd/v2-observer \
            -count=1 -timeout=8m
      - name: Certified multi-height finality history and QC forgery regression
        run: go test -race ./internal/v2/node -run '^TestCertifiedHistory' -count=1 -timeout=3m
      - name: External QC-finalized checkpoint rollback regressions
        run: go test -race ./internal/v2/node -run '^TestPinnedFinalityCheckpoint' -count=1 -timeout=3m
      - name: External monotonic high-water mark and rollback regression
        run: go test -race ./internal/v2/node -run '^Test(FinalityAnchorStore|ExternalFinalityAnchor)' -count=1 -timeout=3m
      - name: Repeated cross-peer consensus shutdown and TempDir lifecycle regression
        run: |
          go test ./internal/api -run '^TestConsensusAutomationRebroadcastsVoteAfterPeerLinkRestored$' -count=80 -timeout=4m
          go test -race ./internal/api -run '^(TestConsensusAutomationRebroadcastsVoteAfterPeerLinkRestored|TestPeerURLsSnapshotConcurrentReplacement)$' -count=12 -timeout=4m
      - name: Concurrent peer broadcast shutdown admission stress
        run: |
          go test -race ./internal/api -run '^TestAsyncPeerBroadcastDrainAndCloseAdmission$' -count=20 -timeout=4m
          go test -race ./internal/api -run '^TestAsyncPeerBroadcastConcurrentClose$' -count=20 -timeout=4m
      - name: Threshold-witness checkpoint and dual independent-ancestor regressions
        run: go test -race ./internal/v2/node -run '^Test(WitnessCheckpoint|WitnessAndExternalHighWater)' -count=1 -timeout=3m
      - name: Witness durability, equivocation and QC-tip adapter regressions
        run: |
          go test -race ./internal/v2/node -run '^Test(WitnessIntent|WitnessEvidenceSet|WitnessQuorumConsistency|RuntimeWitnessVerifier)' -count=5 -timeout=4m
          go test -race ./internal/v2/node -run '^Test(FinalityAnchorStore|CertifiedHistory)' -count=2 -timeout=4m
      - name: Witness external floor rollback and split-brain recovery regression
        run: go test -race ./internal/v2/node -run '^TestWitnessRemoteFloor' -count=10 -timeout=3m
      - name: Authenticated external witness quorum floor regression
        run: go test -race ./internal/v2/node -run '^TestQuorumAuthenticatedWitnessFloor' -count=10 -timeout=3m
      - name: Bounded remote witness transport regression
        run: go test -race ./internal/v2/node -run '^TestHTTPWitnessFloor' -count=5 -timeout=3m
      - name: End-to-end HTTPS quorum witness recovery regression
        run: go test -race ./internal/v2/node -run '^TestWitnessHTTPSQuorumRecoveryEndToEnd$' -count=5 -timeout=3m
      - name: Multi-source signed witness conflict regression
        run: go test -race ./internal/v2/node -run '^TestMultiSourceWitnessFloor' -count=10 -timeout=3m
      - name: Stale quorum external floor regression
        run: go test -race ./internal/v2/node -run '^TestCertifiedWitnessFloorMinimum' -count=10 -timeout=3m
      - name: Witness operator separation policy regression
        run: go test -race ./internal/v2/node -run '^TestOperatorSeparatedWitnessFloor' -count=10 -timeout=3m
      - name: Protected validator signing restart regression under race detector
        run: go test -race ./internal/v2/node -run '^TestProtectedValidatorServicePersistsSigningIntent$' -count=1 -timeout=3m
