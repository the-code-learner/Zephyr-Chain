name: V2 Security Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v2-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    name: Security-sensitive Go race checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Race-check genesis, transport, provider, committee and state
        run: |
          go test -race \
            ./internal/v2/genesis \
            ./internal/v2/network/p2p \
            ./internal/v2/provider \
            ./internal/v2/committee \
            ./internal/v2/worldstate \
            ./internal/v2/consensus \
            ./internal/v2/bootstrap \
            ./cmd/compute-provider \
            ./cmd/zephyr-genesis-audit \
            ./cmd/v2-observer \
            -count=1 -timeout=8m
      - name: Certified multi-height finality history and QC forgery regression
        run: go test -race ./internal/v2/node -run '^TestCertifiedHistory' -count=1 -timeout=3m
      - name: External QC-finalized checkpoint rollback regressions
        run: go test -race ./internal/v2/node -run '^TestPinnedFinalityCheckpoint' -count=1 -timeout=3m
      - name: External monotonic high-water mark and rollback regression
        run: go test -race ./internal/v2/node -run '^Test(FinalityAnchorStore|ExternalFinalityAnchor)' -count=1 -timeout=3m
      - name: Bounded signed peer admission recovery under race
        run: go test -race ./internal/api -run '^TestPeerAdmissionRetry' -count=10 -timeout=4m
      - name: Repeated cross-peer consensus shutdown and TempDir lifecycle regression
        run: |
          go test ./internal/api -run '^TestConsensusAutomationRebroadcastsVoteAfterPeerLinkRestored$' -count=80 -timeout=4m
          go test -race ./internal/api -run '^(TestConsensusAutomationRebroadcastsVoteAfterPeerLinkRestored|TestPeerURLsSnapshotConcurrentReplacement)$' -count=12 -timeout=4m
      - name: Atomic certified commit and WAL crash-recovery regression
        run: go test -race ./internal/ledger -run '^TestCertifiedCommitActionAtomicOnWriteFailureAndRestart$' -count=12 -timeout=3m
      - name: Current-round consensus replay and WAL suppression regression
        run: go test -race ./internal/api -run '^TestConsensusAutomationOnlyRebroadcastsActiveRoundArtifacts$' -count=12 -timeout=3m
      - name: Slow accepted consensus peer delivery and bounded incident regression
        run: go test -race ./internal/api -run '^TestSlowConsensusDelivery' -count=8 -timeout=4m
      - name: Seven-validator last-proposer sweep and QC liveness regression
        run: go test -race ./internal/api -run '^TestLabSevenValidatorsLastProposerNeedsFollowingSweepForQuorum$' -count=5 -timeout=4m
      - name: Scheduled proposer rotation across later odd rounds
        run: |
          go test ./internal/api -run '^TestConsensusAutomationAdvancesRoundAndRotatesProposerAfterTimeout$' -count=50 -timeout=5m
          go test -race ./internal/api -run '^TestConsensusAutomationAdvancesRoundAndRotatesProposerAfterTimeout$' -count=12 -timeout=4m
      - name: Signed peer request redirect and ambient proxy boundary regression
        run: go test -race ./internal/api -run '^Test(HTTPPeerTransportRejectsSignedRedirects|ServerPeerClientIgnoresAmbientProxy)$' -count=10 -timeout=3m
      - name: Consensus peer HTTP conflict reporting regression
        run: go test -race ./internal/api -run '^TestHTTPPeerTransportReportsConsensusConflicts$' -count=10 -timeout=3m
      - name: Certified self-proposed commit action WAL observation stress
        run: |
          go test ./internal/api -run '^TestConsensusAutomationSelfProposesVotesAndCommitsCertifiedBlock$' -count=50 -timeout=4m
          go test -race ./internal/api -run '^TestConsensusAutomationSelfProposesVotesAndCommitsCertifiedBlock$' -count=12 -timeout=4m
      - name: Concurrent peer broadcast shutdown admission stress
        run: |
          go test -race ./internal/api -run '^TestAsyncPeerBroadcastDrainAndCloseAdmission$' -count=20 -timeout=4m
          go test -race ./internal/api -run '^TestAsyncPeerBroadcastConcurrentClose$' -count=20 -timeout=4m
      - name: Threshold-witness checkpoint and dual independent-ancestor regressions
        run: go test -race ./internal/v2/node -run '^Test(WitnessCheckpoint|WitnessAndExternalHighWater|WitnessBundleAssembly)' -count=1 -timeout=3m
      - name: Witness durability, equivocation and QC-tip adapter regressions
        run: |
          go test -race ./internal/v2/node -run '^Test(WitnessIntent|WitnessEvidenceSet|WitnessQuorumConsistency|RuntimeWitnessVerifier)' -count=5 -timeout=4m
          go test -race ./internal/v2/node -run '^Test(FinalityAnchorStore|CertifiedHistory)' -count=2 -timeout=4m
      - name: Witness external floor rollback and split-brain recovery regression
        run: go test -race ./internal/v2/node -run '^TestWitnessRemoteFloor' -count=10 -timeout=3m
      - name: Authenticated external witness quorum floor regression
        run: go test -race ./internal/v2/node -run '^TestQuorumAuthenticatedWitnessFloor' -count=10 -timeout=3m
      - name: Bounded remote witness transport regression
        run: go test -race ./internal/v2/node -run '^Test(HTTPWitnessFloor|WitnessFloorCancellation)' -count=5 -timeout=3m
      - name: End-to-end HTTPS quorum witness recovery regression
        run: go test -race ./internal/v2/node -run '^TestWitnessHTTPSQuorumRecoveryEndToEnd$' -count=5 -timeout=3m
      - name: Multi-source signed witness conflict regression
        run: go test -race ./internal/v2/node -run '^TestMultiSourceWitnessFloor' -count=10 -timeout=3m
      - name: Stale quorum external floor regression
        run: go test -race ./internal/v2/node -run '^TestCertifiedWitnessFloorMinimum' -count=10 -timeout=3m
      - name: Witness operator separation policy regression
        run: go test -race ./internal/v2/node -run '^TestOperatorSeparatedWitnessFloor' -count=10 -timeout=3m
      - name: Atomic witness local remote recovery gate regression
        run: go test -race ./internal/v2/node -run '^TestWitnessAtomicReserveRemoteGate' -count=10 -timeout=3m
      - name: Context-bound witness intent reservation and recovery regression
        run: go test -race ./internal/v2/node -run '^TestWitnessAtomicGateContext' -count=8 -timeout=4m
      - name: Custody HTTPS transport proxy exclusion regression
        run: go test -race ./internal/v2/node -run '^TestAtomicWitnessCustodyHTTP(NoAmbientProxy|EndpointPolicy)$' -count=10 -timeout=3m
      - name: Challenged authenticated witness fencing grant and cross-host fixture regression
        run: go test -race ./internal/v2/node -run '^TestWitnessFence' -count=10 -timeout=3m
      - name: Atomic witness custody signature, concurrency, restart and rollback regression
        run: go test -race ./internal/v2/node -run '^TestAtomicWitnessCustody' -count=5 -timeout=4m
      - name: Local custody signer-provider fencing, crash and equivocation race regression
        run: go test -race ./internal/v2/node -run '^TestLocalWitnessCustody' -count=5 -timeout=4m
      - name: Protected validator signing restart regression under race detector
        run: go test -race ./internal/v2/node -run '^TestProtectedValidatorServicePersistsSigningIntent$' -count=1 -timeout=3m
