name: Temporary v2 worldstate gofmt

on:
  push:
    branches:
      - security-v2-worldstate-exclusive-writer

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'the-code-learner/Zephyr-Chain' && github.ref == 'refs/heads/security-v2-worldstate-exclusive-writer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security-v2-worldstate-exclusive-writer
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact Go format
        run: |
          gofmt -w internal/v2/worldstate/durable.go internal/v2/worldstate/lock_unix.go internal/v2/worldstate/lock_unsupported.go internal/v2/worldstate/lock_test.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/v2/worldstate/durable.go internal/v2/worldstate/lock_unix.go internal/v2/worldstate/lock_unsupported.go internal/v2/worldstate/lock_test.go
          git commit -m 'gofmt v2 exclusive-writer safety code'
          git push origin HEAD:security-v2-worldstate-exclusive-writer
